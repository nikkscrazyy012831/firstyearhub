<div class="folder" onclick="toggleFolder('cpps2')">CPPS</div>
<div id="cpps2" class="folder-content">CPPS question papers here.</div>

<div class="folder" onclick="toggleFolder('maths2')">Maths</div>
<div id="maths2" class="folder-content">Maths question papers here.</div>

<div class="folder" onclick="toggleFolder('ese')">ESE</div>
<div id="ese" class="folder-content">ESE question papers here.</div>
</div>

<div id="assign" class="page hidden">
<h2>Assignments</h2>
<div id="assignmentList" class="card">No assignments uploaded yet.</div>
</div>

<div id="owner" class="page hidden">
<h2>Owner Upload Panel</h2>
<div id="unlockDiv">
<input id="pw" placeholder="Enter owner password">
<button onclick="unlock()">Unlock</button>
</div>

<div id="uploadDiv" class="hidden">
<select id="subj">
<option value="">Select Subject</option>
<option>Physics</option><option>Maths</option><option>IEEE</option>
<option>MFR</option><option>CPPS (Sem1)</option>
<option>CGD</option><option>CST</option><option>CPPS (Sem2)</option>
<option>Maths (Sem2)</option><option>ESE</option>
</select><br>
<input id="fileName" placeholder="Enter file name"><br>
<button onclick="addAssignment()">Upload Assignment</button>
</div>
</div>

</div>

<script>
function show(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}

function toggleFolder(id){
 let x=document.getElementById(id);
 x.style.display = x.style.display==='block' ? 'none' : 'block';
}

const OWNER_PASSWORD="1234";
function unlock(){
 if(document.getElementById("pw").value==OWNER_PASSWORD){
   document.getElementById("unlockDiv").classList.add("hidden");
   document.getElementById("uploadDiv").classList.remove("hidden");
 } else alert("Wrong password");
}

let assignments=[];
function addAssignment(){
 let s=document.getElementById("subj").value;
 let f=document.getElementById("fileName").value;
 if(!s||!f) return alert("Fill all fields");
 assignments.push({subject:s, file:f});
 renderAssignments();
 alert("Uploaded!");
}

function renderAssignments(){
 let d=document.getElementById("assignmentList");
 if(assignments.length===0){d.innerHTML="No assignments uploaded yet."; return;}
 d.innerHTML="";
 assignments.forEach(a=>{
   d.innerHTML+=`<div class='card'><b>${a.subject}</b>: ${a.file}</div>`;
 });
}
</script>

</body>
</html>
